services:
  - type: web
    name: orven-store
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate && npm run db:migrate && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: '24.18.0'
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PRODUCT_IMAGES_BUCKET
        value: product-images
      - key: APP_URL
        sync: false
      - key: PAYMENT_MODE
        value: sandbox
      - key: ORVEN_RUNTIME
        value: node
      - key: CLOUDFLARE_BUILD
        value: '0'
